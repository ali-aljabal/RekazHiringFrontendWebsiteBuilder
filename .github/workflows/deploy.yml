name: Deploy Next.js App with Docker + SSL

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Lowercase repository name
        id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:latest

      - name: Deploy on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            DOMAIN="rekaz-task.alialjabal.com"
            SSL_EMAIL="admin@${DOMAIN}"
            IMAGE="ghcr.io/${{ steps.repo.outputs.name }}:latest"
            CONTAINER="rekaztask"
            APP_PORT=6000
            NGINX_CONF="/etc/nginx/sites-available/${DOMAIN}"

            # ── Docker: pull and restart container ────────────────────
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            docker pull "$IMAGE"
            docker stop "$CONTAINER" 2>/dev/null || true
            docker rm   "$CONTAINER" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER" \
              --restart unless-stopped \
              -p 127.0.0.1:${APP_PORT}:${APP_PORT} \
              -e NODE_ENV=production \
              "$IMAGE"

            # ── Install nginx and certbot if not present ──────────────
            if ! command -v nginx &>/dev/null; then
              sudo apt-get update -qq
              sudo apt-get install -y nginx certbot python3-certbot-nginx
            fi

            # ── First deploy: get SSL cert ────────────────────────────
            if [ ! -d "/etc/letsencrypt/live/${DOMAIN}" ]; then

              # Write HTTP-only config using printf (no heredoc issues)
              printf 'server {\n    listen 80;\n    server_name %s;\n    location / {\n        proxy_pass http://127.0.0.1:%s;\n        proxy_http_version 1.1;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n    }\n}\n' "$DOMAIN" "$APP_PORT" | sudo tee "$NGINX_CONF" > /dev/null

              sudo ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/"${DOMAIN}"
              sudo nginx -t
              sudo systemctl reload nginx

              # Get SSL certificate
              sudo certbot certonly --nginx \
                -d "$DOMAIN" \
                --non-interactive \
                --agree-tos \
                -m "$SSL_EMAIL"
            else
              # Subsequent deploys: just renew if needed
              sudo certbot renew --non-interactive
            fi

            # ── Write full HTTPS config (cert exists at this point) ───
            printf 'server {\n    listen 80;\n    server_name %s;\n    return 301 https://$server_name$request_uri;\n}\nserver {\n    listen 443 ssl;\n    server_name %s;\n    ssl_certificate /etc/letsencrypt/live/%s/fullchain.pem;\n    ssl_certificate_key /etc/letsencrypt/live/%s/privkey.pem;\n    ssl_protocols TLSv1.2 TLSv1.3;\n    location / {\n        proxy_pass http://127.0.0.1:%s;\n        proxy_http_version 1.1;\n        proxy_set_header Upgrade $http_upgrade;\n        proxy_set_header Connection upgrade;\n        proxy_set_header Host $host;\n        proxy_set_header X-Real-IP $remote_addr;\n        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;\n        proxy_set_header X-Forwarded-Proto $scheme;\n        proxy_cache_bypass $http_upgrade;\n    }\n}\n' "$DOMAIN" "$DOMAIN" "$DOMAIN" "$DOMAIN" "$APP_PORT" | sudo tee "$NGINX_CONF" > /dev/null

            sudo ln -sf "$NGINX_CONF" /etc/nginx/sites-enabled/"${DOMAIN}"
            sudo nginx -t
            sudo systemctl reload nginx

            # ── Cleanup ───────────────────────────────────────────────
            docker image prune -f
            echo "✅ DEPLOYMENT COMPLETE"