services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: RekazTask
    restart: unless-stopped
    ports:
      - "127.0.0.1:6000:6000"   # Only exposed locally — Nginx proxies from outside
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6000/ || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
